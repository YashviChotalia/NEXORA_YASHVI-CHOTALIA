# Runs as the unprivileged Space user: every writable path is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 100m;   # matches ANVESH_MAX_UPLOAD_MB
    server_tokens off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Spaces terminate TLS in front of us and send X-Forwarded-Proto: https
    map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

    server {
        listen 7860;

        # API and live-call WebSocket -> FastAPI. The real client address is forwarded so that
        # "server-only" checks (first-run setup) never see the proxy's 127.0.0.1.
        location ~ ^/(api|ws)/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
        }
    }
}
