name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check anvesh tests --select E,F,W --ignore E501,E741
      - run: pytest -q
      - run: python eval/run_eval.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements-dev.txt
      - name: Security tests
        working-directory: backend
        run: pytest -q tests/test_security.py
      - name: Static analysis (bandit, medium+ severity fails)
        run: bandit -q -r backend/anvesh -ll
      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend dependency audit (production, high+ fails)
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Assemble the Hugging Face Space build
        run: python scripts/deploy_space.py --no-upload
      - name: Check start script and nginx config
        run: |
          sh -n logs/space-build/start.sh
          head -c 2 logs/space-build/start.sh | grep -q '#!'
          ! grep -q $'\r' logs/space-build/start.sh
          sudo apt-get install -y -q nginx >/dev/null
          sudo nginx -t -c "$PWD/logs/space-build/nginx.conf"
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build the frontend in same-origin mode (as in the Space)
        working-directory: logs/space-build/frontend
        env: { NEXT_PUBLIC_API_URL: "" }
        run: npm ci && npm run build
